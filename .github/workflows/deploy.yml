name: Deploy to Server

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via rsync
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          set -e

          echo "Setting up SSH..."
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          echo "$SSH_PUBLIC_KEY" > ~/.ssh/id_ed25519.pub
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/id_ed25519

          echo "Testing SSH connection..."
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519 "$SSH_USERNAME@$SSH_HOST" "echo Connected OK"

          echo "Running rsync deployment..."
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519 "$SSH_USERNAME@$SSH_HOST:/var/www/nixmart/" echo "Deployment complete."
