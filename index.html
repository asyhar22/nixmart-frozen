<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Nixmart — Modern Product Showcase</title>
  <link rel="icon" href="assets/img/logo/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/logo/logo-32x32.png">
  <link rel="icon" type="image/png" sizes="180x60" href="assets/img/logo/logo-180x60.png">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="fade-page">
  <header class="site-header">
    <div class="container header-inner">
        <a class="logo" href="index.html">
        <img src="assets/img/logo/logo-180x60.png" alt="Nixmart logo" class="logo-img">
      </a>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <picture>
        <source srcset="assets/img/hero/Hero_NixMart_large.webp" type="image/webp">
        <source srcset="assets/img/hero/Hero_NixMart_large.png" media="(min-width: 900px)">
        <img src="assets/img/hero/Hero_NixMart_medium.webp" alt="Nixmart modern products" loading="lazy">
      </picture>
      <div class="hero-content container">
        <h1>Modern products that fit your life</h1>
        <p>Curated selection. Thoughtful design. Reliable performance.</p>
        <a class="btn" href="products.html">Browse Products</a>
      </div>
    </section>

    <section class="featured container">
      <h2>Featured products</h2>
      <div id="product-grid" class="grid"></div>

      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> Nixmart — All rights reserved.</p>
    </div>
  </footer>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/productData.js"></script>
  <script src="assets/js/renderProducts.js"></script>
</body>
</html>
