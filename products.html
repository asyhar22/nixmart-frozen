<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Products — Nixmart</title>
    <link rel="icon" href="assets/img/logo/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/logo/logo-32x32.png" />
    <link rel="icon" type="image/png" sizes="180x60" href="assets/img/logo/logo-180x60.png" />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body class="fade-page">
    <div data-include="includes/header.html"></div>

    <main class="container">
      <h1>Products</h1>
      <!-- Product grid is rendered dynamically by assets/js/renderProducts.js -->
      <div class="product-controls">
        <input type="text" id="search" placeholder="Search products…" />
        <select id="category-filter">
          <option value="all">All Categories</option>
          <option value="Main Dish">Main Dish</option>
          <option value="Appetizer">Appetizer</option>
          <option value="Salad">Salad</option>
          <option value="Noodles">Noodles</option>
          <option value="Dessert">Dessert</option>
          <option value="Stir-Fry">Stir-Fry</option>
          <option value="Pasta">Pasta</option>
        </select>
      </div>

      <div id="product-grid" class="grid"></div>
    </main>

    <div data-include="includes/footer.html"></div>

    <script src="assets/js/includeComponents.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/productData.js"></script>
    <script src="assets/js/renderProducts.js"></script>
    <script src="assets/js/filterProducts.js"></script>
  </body>
</html>
